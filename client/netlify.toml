[build]
  command   = "npm run build"
  publish   = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION         = "20"
  NEXT_PUBLIC_API_BASE = ""

# Proxy /api/* to the Render backend — update the :to URL with your Render service URL
[[redirects]]
  from   = "/api/*"
  to     = "https://knowwork-api.onrender.com/api/:splat"
  status = 200
  force  = true
